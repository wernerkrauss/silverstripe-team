name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          tools: phpcs

      - name: PHPCS check
        run: |
          if [ -f phpcs.xml.dist ]; then
            phpcs --standard=phpcs.xml.dist src/
          elif [ -f phpcs.xml ]; then
            phpcs --standard=phpcs.xml src/
          else
            # Fallback to a default standard if no config exists
            phpcs --standard=PSR12 src/
          fi

  stan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: phpstan
          extensions: mbstring, intl

      - name: PHPStan
        run: |
          if [ -f phpstan.neon ]; then
            phpstan analyze -c phpstan.neon src/
          else
            phpstan analyze src/
          fi
